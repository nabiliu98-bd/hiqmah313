<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A3B2C"/>
      <stop offset="100%" stop-color="#052017"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.65"/>
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#34D399" stroke-width="2" opacity="0.3"/>

  <!-- Centered Emblem -->
  <g filter="url(#glow)" transform="translate(0, 8)">
    <!-- Outer Crescent/Wreath Geometry -->
    <path d="M 256 90 C 180 90 120 145 110 230 C 100 315 160 400 256 420 C 352 400 412 315 402 230 C 392 145 332 90 256 90 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8"/>

    <!-- Inner Minaret / Shield Core -->
    <path d="M 256 120 L 330 180 L 330 310 C 330 365 295 400 256 414 C 217 400 182 365 182 310 L 182 180 Z" 
          fill="#062E22" stroke="url(#emeraldGrad)" stroke-width="6"/>

    <!-- Open Book / Quran Pages at base -->
    <path d="M 256 295 Q 220 275 195 285 L 195 345 Q 220 335 256 355 Q 292 335 317 345 L 317 285 Q 292 275 256 295 Z" 
          fill="url(#goldGrad)"/>
    <line x1="256" y1="295" x2="256" y2="355" stroke="#052017" stroke-width="3"/>

    <!-- Minaret Dome & Spire -->
    <path d="M 256 150 C 242 170 230 190 230 215 L 282 215 C 282 190 270 170 256 150 Z" 
          fill="url(#emeraldGrad)"/>
    <polygon points="256,130 252,150 260,150" fill="url(#goldGrad)"/>
    <circle cx="256" cy="126" r="4" fill="#FCD34D"/>

    <!-- Arch Window -->
    <path d="M 246 250 A 10 10 0 0 1 266 250 L 266 280 L 246 280 Z" fill="#0A3B2C" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Golden Star -->
    <polygon points="256,92 260,104 272,104 262,111 266,123 256,115 246,123 250,111 240,104 252,104" fill="url(#goldGrad)"/>
  </g>
</svg>
